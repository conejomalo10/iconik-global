<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>ICONIK Clone</title>
<style>
body {
    background: radial-gradient(circle at top, #0f172a, #000000);
    color: white;
    font-family: 'Segoe UI', sans-serif;
}
.glow {
    text-shadow: 0 0 15px rgba(255, 100, 255, 0.8);
}
.btn-gradient {
    background: linear-gradient(90deg, #00c6ff, #ff00cc);
}
.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center">

<div class="w-full flex justify-between items-center p-4">
    <h1 class="text-2xl font-bold glow">ICONIK</h1>
    <button class="px-6 py-2 rounded-lg btn-gradient font-semibold">JOIN FREE</button>
</div>

<div class="text-center mt-10 max-w-3xl">
    <p class="text-gray-400 italic mb-4">Welcome to the World's Fan Ecosystem</p>
    <h1 class="text-6xl font-bold glow mb-4">ICONIK</h1>
    <p class="text-xl mb-6">Your Favorite Celebrity's Platform</p>
    <p class="tracking-widest text-sm text-gray-300 mb-8">FIND YOUR CIRCLE | FOLLOW YOUR ICON</p>
</div>

<div class="flex gap-6 mt-6">
    <div class="card p-6 rounded-xl text-center w-40">
        <h2 class="text-3xl font-bold">13+</h2>
        <p class="text-sm">ICON CATEGORIES</p>
    </div>
    <div class="card p-6 rounded-xl text-center w-40">
        <h2 class="text-3xl font-bold">7</h2>
        <p class="text-sm">CONTINENTS</p>
    </div>
    <div class="card p-6 rounded-xl text-center w-40">
        <h2 class="text-3xl font-bold">∞</h2>
        <p class="text-sm">ICONS & STARS</p>
    </div>
</div>

<div class="mt-10">
    <button class="px-10 py-4 rounded-xl btn-gradient text-lg font-semibold shadow-lg">
        JOIN THE COMMUNITY
    </button>
</div>

</body>
</html>
