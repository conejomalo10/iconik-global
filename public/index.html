<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICONIK • Fan Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0a0a0a;
      font-family: 'Inter', system_ui, sans-serif;
    }
    .neon-glow {
      text-shadow: 0 0 25px rgba(249, 168, 212, 0.6),
                   0 0 50px rgba(192, 38, 211, 0.4);
    }
    .glass {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .smoke-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(103, 232, 249, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 70% 70%, rgba(168, 85, 247, 0.08) 0%, transparent 60%);
      opacity: 0.75;
      pointer-events: none;
    }
    .sharp-text {
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      -webkit-text-stroke: 0.5px rgba(255,255,255,0.15);
    }
  </style>
</head>
<body class="min-h-screen text-white relative overflow-hidden">
  <!-- Background Smoke -->
  <div class="smoke-bg"></div>

  <!-- Navigation -->
  <nav class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-8 py-6">
    <div class="text-4xl font-black tracking-tighter neon-glow">ICONIK</div>
    <div class="flex items-center gap-6">
      <button class="glass px-10 py-4 rounded-3xl font-semibold tracking-widest text-sm hover:bg-white/10 transition-all">
        JOIN FREE
      </button>
      <button class="w-12 h-12 glass rounded-3xl flex items-center justify-center text-2xl">☰</button>
    </div>
  </nav>

  <div class="relative min-h-screen flex items-center justify-center pt-20">
    <div class="text-center max-w-5xl mx-auto px-6">
      <!-- Welcome -->
      <p class="text-lg tracking-[4px] text-zinc-400 mb-8 font-light">
        Welcome to the World's Fan Ecosystem
      </p>

      <!-- Main Logo -->
      <h1 class="text-[110px] md:text-[140px] font-black tracking-[-4px] leading-none mb-8 neon-glow">
        ICONIK
      </h1>

      <!-- Tagline -->
      <p class="text-4xl md:text-5xl font-light mb-10 sharp-text text-white">
        Your Favorite Celebrity's Platform
      </p>

      <!-- Main CTA -->
      <div class="text-3xl md:text-4xl font-medium tracking-widest mb-16 sharp-text text-white">
        FIND YOUR TRIBE | FOLLOW YOUR ICON
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-4xl mx-auto mb-20">
        <div class="glass rounded-3xl p-10">
          <div class="text-7xl font-bold text-pink-300">13+</div>
          <div class="text-sm uppercase tracking-widest mt-4">ICON CATEGORIES</div>
        </div>
        <div class="glass rounded-3xl p-10">
          <div class="text-7xl font-bold text-purple-300">7</div>
          <div class="text-sm uppercase tracking-widest mt-4">CONTINENTS</div>
        </div>
        <div class="glass rounded-3xl p-10">
          <div class="text-7xl font-bold text-cyan-300">∞</div>
          <div class="text-sm uppercase tracking-widest mt-4">ICONS & RISING STARS</div>
        </div>
      </div>

      <!-- Join Button -->
      <button class="glass text-2xl font-semibold tracking-widest px-20 py-8 rounded-3xl border border-white/10 hover:border-white/30 transition-all hover:scale-105">
        JOIN THE COMMUNITY
      </button>
    </div>
  </div>
</body>
</html>
