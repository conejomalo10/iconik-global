<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ICONIK - Your Favorite Celebrity's Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #0a0a2e 0%, #0f1b3a 100%);
      font-family: 'Inter', system-ui, sans-serif;
    }
    .hero-bg {
      background-image: 
        radial-gradient(circle at 30% 20%, rgba(255, 215, 0, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(0, 255, 200, 0.1) 0%, transparent 50%);
    }
    .glow-text {
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6),
                   0 0 40px rgba(255, 215, 0, 0.4);
    }
    .iconik-logo {
      font-family: 'Playfair Display', serif;
      letter-spacing: 4px;
    }
  </style>
</head>
<body class="text-white overflow-x-hidden">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full z-50 bg-black/70 backdrop-blur-md border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
      <div class="text-3xl font-bold tracking-widest text-amber-300 iconik-logo">ICONIK</div>
      
      <button onclick="alert('Join Free clicked!')" 
              class="px-8 py-3 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/30 rounded-xl text-sm font-medium transition-all">
        JOIN FREE
      </button>

      <button class="w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-white/20 rounded-xl transition-all">
        <i class="fa-solid fa-bars text-cyan-400 text-xl"></i>
      </button>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="min-h-screen hero-bg flex items-center pt-20 relative">
    <div class="max-w-7xl mx-auto px-6 text-center relative z-10">
      
      <!-- Welcome Text -->
      <p class="text-lg md:text-xl text-cyan-200 mb-6 tracking-widest">
        Welcome to the World's Fan Ecosystem
      </p>

      <!-- Main Logo -->
      <div class="mb-8">
        <h1 class="text-7xl md:text-8xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-200 to-cyan-300 iconik-logo glow-text">
          ICONIK
        </h1>
      </div>

      <!-- Tagline -->
      <p class="text-xl md:text-2xl text-white/90 italic mb-12 max-w-2xl mx-auto">
        Your Favorite Celebrity's Platform
      </p>

      <!-- Main Call to Action -->
      <div class="mb-16">
        <p class="text-3xl md:text-4xl font-medium tracking-wider text-white mb-3">
          FIND YOUR TRIBE FOLLOW YOUR ICON
        </p>
        <div class="w-24 h-0.5 bg-gradient-to-r from-transparent via-cyan-400 to-transparent mx-auto"></div>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-4xl mx-auto mb-20">
        <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl p-8 hover:border-amber-300/50 transition-all group">
          <div class="text-5xl font-bold text-amber-300 mb-2">13+</div>
          <div class="text-sm tracking-widest text-white/70">ICON CATEGORIES</div>
        </div>
        <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl p-8 hover:border-amber-300/50 transition-all group">
          <div class="text-5xl font-bold text-amber-300 mb-2">7</div>
          <div class="text-sm tracking-widest text-white/70">CONTINENTS</div>
        </div>
        <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl p-8 hover:border-amber-300/50 transition-all group">
          <div class="text-5xl font-bold text-amber-300 mb-3">∞</div>
          <div class="text-sm tracking-widest text-white/70">ICONS & RISING STARS</div>
        </div>
      </div>

      <!-- Bottom CTA -->
      <button onclick="alert('Join the community clicked!')"
              class="px-16 py-6 bg-gradient-to-r from-cyan-400 to-emerald-400 hover:from-cyan-500 hover:to-emerald-500 text-black font-semibold text-xl rounded-2xl transition-all transform hover:scale-105 shadow-2xl shadow-cyan-500/30">
        JOIN THE COMMUNITY
      </button>
    </div>

    <!-- Floating Decorative Icons -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
      <!-- You can add more decorative floating icons here with absolute positioning and animation if needed -->
    </div>
  </section>

  <script>
    // Simple tailwind script already included via CDN
  </script>
</body>
</html>
