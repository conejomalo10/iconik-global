<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>I-Messenger</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#060A12;--bg2:#0D1117;--bg3:#161B27;
  --accent:#0A84FF;--err:#FF453A;--text:#E8EDF5;
  --text2:#B8C4D0;--text3:#8A9BB0;--muted:#556070;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.12);
  --card:#0D1117;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Sora",sans-serif;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;position:relative;overflow:hidden;}
#topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;z-index:99;}
#topbar .tb-back{display:none;cursor:pointer;font-size:1.2rem;color:var(--accent);background:none;border:none;}
#topbar .tb-title{font-weight:800;font-size:1rem;flex:1;color:var(--text);}
#topbar .tb-av{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:0.9rem;overflow:hidden;cursor:pointer;}
#topbar .tb-av img{width:100%;height:100%;object-fit:cover;}
#topbar .tb-actions{display:flex;gap:6px;}
#topbar .tb-btn{background:none;border:none;color:var(--text3);font-size:1.1rem;cursor:pointer;padding:4px;}
.screen{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0;}
.screen.active{display:flex;flex:1;flex-direction:column;overflow:hidden;min-height:0;}
#screenChat.active{position:fixed;top:0;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);z-index:100;}
#convSearch{padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
#convSearch input{width:100%;padding:9px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:0.76rem;font-family:"Sora",sans-serif;outline:none;}
#convList{flex:1;overflow-y:auto;padding:4px 0;}
.ci{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.15s;}
.ci:active{background:var(--bg3);}
.cav{width:46px;height:46px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;overflow:hidden;position:relative;}
.cav img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.odot{position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:#30D158;border:2px solid var(--bg2);}
.cnfo{flex:1;min-width:0;}
.cnm{font-weight:700;font-size:0.82rem;margin-bottom:2px;}
.clst{font-size:0.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cmeta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.ctim{font-size:0.6rem;color:var(--muted);}
.cbdg{background:var(--accent);color:#fff;border-radius:10px;padding:2px 6px;font-size:0.58rem;font-weight:700;}
#fab{position:absolute;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(10,132,255,0.4);z-index:10;}
#chatHdr{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;z-index:101;}
#chatAv{width:38px;height:38px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:0.9rem;overflow:hidden;flex-shrink:0;}
#chatAv img{width:100%;height:100%;object-fit:cover;}
#chatNfo{flex:1;}
#chatNm{font-weight:800;font-size:0.88rem;}
#chatSt{font-size:0.6rem;color:var(--muted);}
.ca-btn{background:none;border:none;color:var(--text3);font-size:1.1rem;cursor:pointer;padding:6px;}
#msgList{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow-x:hidden;}
.mb{max-width:78%;padding:9px 12px;border-radius:14px;font-size:0.78rem;line-height:1.5;position:relative;word-break:break-word;}
.mb.sent{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.mb.recv{background:var(--bg3);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px;}
.mt{font-size:0.55rem;opacity:0.7;margin-top:3px;text-align:right;}
.mimg{width:100%;max-width:240px;border-radius:10px;cursor:zoom-in;display:block;margin-bottom:4px;}
.mrx{position:absolute;bottom:-8px;right:6px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1px 5px;font-size:0.7rem;}
.dsep{text-align:center;font-size:0.6rem;color:var(--muted);padding:8px 0;}
#inputBar{flex-shrink:0;width:100%;border-top:1px solid var(--border);}
#msgInput{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:9px 14px;color:var(--text);font-family:"Sora",sans-serif;font-size:0.76rem;outline:none;resize:none;max-height:100px;overflow-y:auto;}
.ib-btn{background:none;border:none;color:var(--text3);font-size:1.2rem;cursor:pointer;padding:4px;flex-shrink:0;}
#sendBtn{width:36px;height:36px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:0.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#memberSearch{padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
#memberSearch input{width:100%;padding:9px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:0.76rem;font-family:"Sora",sans-serif;outline:none;}
#memberList{flex:1;overflow-y:auto;}
#grpForm{padding:16px;flex:1;overflow-y:auto;}
.gfi{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:"Sora",sans-serif;font-size:0.76rem;outline:none;margin-bottom:10px;}
.mchip{display:inline-flex;align-items:center;gap:4px;background:rgba(10,132,255,0.15);border:1px solid rgba(10,132,255,0.3);border-radius:20px;padding:3px 8px;font-size:0.62rem;color:var(--accent);margin:2px;}
#emojiPicker{display:none;position:fixed;bottom:120px;left:10px;right:10px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;z-index:500;flex-wrap:wrap;gap:8px;max-width:460px;}

.epem{font-size:1.3rem;cursor:pointer;padding:2px;}
#callScr{display:none;position:fixed;inset:0;background:#060A12;z-index:9998;flex-direction:column;align-items:center;justify-content:center;}
#callScr.active{display:flex;}
.call-btn{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;font-size:1.3rem;display:flex;align-items:center;justify-content:center;margin:0 10px;}
.cbend{background:#FF453A;}
.cbmut{background:rgba(255,255,255,0.15);}
#dlPrm{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;align-items:flex-end;justify-content:center;}
#dlPrm.show{display:flex;}
#dlBox{background:var(--bg2);border-radius:16px 16px 0 0;padding:24px 20px;width:100%;max-width:480px;border:1px solid var(--border);}
#mToast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(30,40,60,0.97);border:1px solid var(--border);border-radius:8px;padding:9px 16px;font-size:0.72rem;color:var(--text);z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
#mToast.show{opacity:1;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="tb-back" id="tbBack" onclick="goBack()">&#8592;</button>
    <div id="tbTitle" class="tb-title" style="display:flex;align-items:center;gap:3px;line-height:1;">
  <div style="width:3px;height:13px;background:linear-gradient(135deg,#FF1D25 0%,#FF1D25 48%,#ffffff 48%,#ffffff 100%);border-radius:1px;flex-shrink:0;"></div>
  <span style="color:#fff;font-family:'Montserrat',sans-serif;font-weight:700;font-size:1rem;letter-spacing:0.5px;line-height:1;">-MESSENGER</span>
</div>
    <div id="tbAv" class="tb-av"><span id="tbAvLtr">?</span></div>
    <div class="tb-actions">
      <button class="tb-btn" id="tbGrp" onclick="showScreen('newgroup')">&#128101;</button>
      <button class="tb-btn" onclick="location.href='/dashboard.html'">&#8962;</button>
    </div>
  </div>

  <!-- CONVERSATIONS -->
  <div class="screen active" id="screenConvs">
    <div id="convSearch"><input id="convSrch" placeholder="&#128269; Search conversations..." oninput="filterConvs()"/></div>
    <div id="convList"><div style="text-align:center;padding:40px;color:var(--muted);font-size:0.8rem;">Loading...</div></div>
    <button id="fab" onclick="showScreen('newchat')">&#9998;</button>
  </div>

  <!-- NEW CHAT -->
  <div class="screen" id="screenNewchat">
    <div id="memberSearch"><input id="memberSrch" placeholder="&#128269; Search members..." oninput="searchMembers()"/></div>
    <div id="memberList"><div style="text-align:center;padding:24px;color:var(--muted);font-size:0.76rem;">Type a name to find members</div></div>
  </div>

  <!-- NEW GROUP -->
  <div class="screen" id="screenNewgroup">
    <div id="grpForm">
      <div style="font-size:0.65rem;font-weight:800;letter-spacing:0.15em;color:var(--accent);margin-bottom:10px;">CREATE GROUP</div>
      <input class="gfi" id="grpName" placeholder="Group name..."/>
      <div style="font-size:0.65rem;font-weight:800;letter-spacing:0.15em;color:var(--accent);margin-bottom:6px;">ADD MEMBERS</div>
      <input class="gfi" id="grpSrch" placeholder="Search members to add..." oninput="searchGrpMembers()"/>
      <div id="grpChips" style="margin-bottom:10px;min-height:28px;"></div>
      <div id="grpMbrList" style="max-height:180px;overflow-y:auto;margin-bottom:12px;"></div>
      <button style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:Sora,sans-serif;font-weight:700;font-size:0.78rem;cursor:pointer;" onclick="createGroup()">Create Group &#128101;</button>
    </div>
  </div>

  <!-- CHAT -->
  <div class="screen" id="screenChat">
    <div id="chatHdr">
      <div id="chatAv"><span id="chatAvLtr">?</span></div>
      <div id="chatNfo">
        <div id="chatNm">Chat</div>
        <div id="chatSt">Online</div>
      </div>
      <button class="ca-btn" onclick="startCall('voice')">&#128222;</button>
      <button class="ca-btn" onclick="startCall('video')">&#128249;</button>
      <button class="ca-btn" onclick="mToast('Info coming soon')">&#8505;&#65039;</button>
    </div>
    <div id="msgList"></div>
    <div id="inputBar">
      <div style="display:flex;align-items:flex-end;gap:8px;background:var(--bg2);padding:8px 12px;">
        <button onclick="document.getElementById('mediaIn').click()" style="width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1.5px solid var(--border);color:var(--text3);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:300;">+</button>
        <input type="file" id="mediaIn" accept="image/*,video/*,.pdf,.mp3,audio/*" style="display:none;" onchange="handleMedia(this)"/>
        <textarea id="msgInput" placeholder="Message..." rows="1" onkeydown="onKey(event)" oninput="autoResize(this)" style="flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:18px;padding:9px 14px;color:var(--text);font-family:Sora,sans-serif;font-size:0.8rem;outline:none;resize:none;max-height:120px;overflow-y:auto;min-width:0;line-height:1.4;"></textarea>
        <button onclick="sendMsg()" style="width:34px;height:34px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">&#8593;</button>
      </div>
    </div>
  </div>
</div>

<div id="emojiPicker" style="display:none;position:fixed;bottom:70px;left:10px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px;z-index:200;flex-wrap:wrap;gap:4px;max-width:260px;">
  <span class="epem" onclick="insEmoji('&#128512;')">&#128512;</span>
  <span class="epem" onclick="insEmoji('&#128514;')">&#128514;</span>
  <span class="epem" onclick="insEmoji('&#10084;&#65039;')">&#10084;&#65039;</span>
  <span class="epem" onclick="insEmoji('&#128293;')">&#128293;</span>
  <span class="epem" onclick="insEmoji('&#128079;')">&#128079;</span>
  <span class="epem" onclick="insEmoji('&#128525;')">&#128525;</span>
  <span class="epem" onclick="insEmoji('&#128591;')">&#128591;</span>
  <span class="epem" onclick="insEmoji('&#128175;')">&#128175;</span>
  <span class="epem" onclick="insEmoji('&#127881;')">&#127881;</span>
  <span class="epem" onclick="insEmoji('&#128077;')">&#128077;</span>
  <span class="epem" onclick="insEmoji('&#128557;')">&#128557;</span>
  <span class="epem" onclick="insEmoji('&#128170;')">&#128170;</span>
</div>

<!-- CALL SCREEN -->
<div id="callScr">
  <div style="font-size:4rem;margin-bottom:16px;" id="callIco">&#128222;</div>
  <div id="callNm" style="font-size:1.4rem;font-weight:800;color:#fff;margin-bottom:8px;">Calling...</div>
  <div id="callSt" style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:40px;">Connecting...</div>
  <div style="display:flex;">
    <button class="call-btn cbmut" onclick="mToast('Muted')">&#128263;</button>
    <button class="call-btn cbend" onclick="endCall()">&#128245;</button>
    <button class="call-btn cbmut" onclick="mToast('Speaker on')">&#128266;</button>
  </div>
</div>

<!-- DOWNLOAD PROMPT -->
<div id="dlPrm">
  <div id="dlBox">
    <div style="font-size:2.5rem;text-align:center;margin-bottom:12px;">&#128241;</div>
    <div style="font-weight:800;font-size:0.96rem;text-align:center;margin-bottom:8px;">Get I-Messenger</div>
    <div style="font-size:0.72rem;color:var(--muted);text-align:center;line-height:1.6;margin-bottom:16px;" id="dlMsg">Download the ICONIK Messenger App for the full experience.</div>
    <button style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:Sora,sans-serif;font-weight:700;font-size:0.78rem;cursor:pointer;margin-bottom:8px;" onclick="installPWA()">&#128241; Download I-Messenger</button>
    <button style="width:100%;padding:10px;background:none;border:1px solid var(--border);border-radius:8px;font-family:Sora,sans-serif;color:var(--muted);font-size:0.72rem;cursor:pointer;" onclick="document.getElementById('dlPrm').classList.remove('show')">Not Now</button>
  </div>
</div>

<div id="mToast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import{getFirestore,collection,doc,setDoc,getDoc,getDocs,addDoc,updateDoc,deleteDoc,query,where,orderBy,limit,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const cfg={apiKey:"AIzaSyCnX9DszicduSwsFwBZ_iTLI47NPeXkteE",authDomain:"iconik-global.firebaseapp.com",projectId:"iconik-global",storageBucket:"iconik-global.firebasestorage.app",messagingSenderId:"1040054516979",appId:"1:1040054516979:web:33cd5f07ae8fc146a30b86"};
const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

let cU=null,cD=null,activeCid=null,activeCdata=null,msgUnsub=null,convUnsub=null;
let allConvs=[],allMembers=[],grpSel=[],isRec=false,mediaRec=null;

function xe(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function xu(s){return encodeURI(s||"");}

function mToast(msg){
  var t=document.getElementById("mToast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(function(){t.classList.remove("show");},2800);
}
window.mToast=mToast;

function fmtTime(ts){
  if(!ts)return"";
  var d=ts.seconds?new Date(ts.seconds*1000):new Date(ts);
  var now=new Date();var diff=now-d;
  if(diff<86400000)return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  if(diff<604800000)return["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
  return d.toLocaleDateString([],{month:"short",day:"numeric"});
}
function fmtFull(ts){
  if(!ts)return"";
  var d=ts.seconds?new Date(ts.seconds*1000):new Date(ts);
  return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
}
function hasVIP(){return cD&&["VIP Bronze","VIP Silver","VIP Gold"].includes(cD.tier);}

onAuthStateChanged(auth,async function(u){
  if(!u){location.replace("/app.html");return;}
  cU=u;
  try{var d=await getDoc(doc(db,"users",u.uid));if(d.exists())cD={id:d.id,...d.data()};else cD={id:u.uid,name:u.displayName||"Member",tier:"Fan"};}catch(e){}
  var al=document.getElementById("tbAvLtr");
  if(al)al.textContent=(cD.name||"M").charAt(0).toUpperCase();
  if(cD.profilePic&&cD.profilePic.startsWith("http")){
    var av=document.getElementById("tbAv");
    if(av)av.innerHTML='<img src="'+xu(cD.profilePic)+'" onerror="this.remove()"/>';
  }
  loadConvs();
  loadMembers();
  // Open direct chat if launched from member profile with ?uid=
  var urlP=new URLSearchParams(location.search);
  var paramUid=urlP.get("uid");
  var paramName=urlP.get("name")||"Member";
  var paramAv=urlP.get("av")||"";
  if(paramUid){
    setTimeout(function(){startDirect(paramUid,paramName,paramAv);},1200);
  }
});

window.showScreen=function(name){
  document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("active");});
  var id="screen"+name.charAt(0).toUpperCase()+name.slice(1);
  var s=document.getElementById(id);
  if(s)s.classList.add("active");
  var back=document.getElementById("tbBack");
  var grpBtn=document.getElementById("tbGrp");
  var title=document.getElementById("tbTitle");
  var tbAv=document.getElementById("tbAv");
  if(name==="convs"){
    back.style.display="none";
    grpBtn.style.display="";title.innerHTML='<div style="display:flex;align-items:center;gap:3px;line-height:1;"><div style="width:3px;height:13px;background:linear-gradient(135deg,#FF1D25 0%,#FF1D25 48%,#ffffff 48%,#ffffff 100%);border-radius:1px;flex-shrink:0;"></div><span style="color:#fff;font-family:Montserrat,sans-serif;font-weight:900;font-size:1rem;letter-spacing:0.5px;line-height:1;">-MESSENGER</span></div>';tbAv.style.display="flex";
    if(msgUnsub){msgUnsub();msgUnsub=null;}
  }else if(name==="chat"){
    back.style.display="block";grpBtn.style.display="none";tbAv.style.display="none";
  }else{
    back.style.display="block";grpBtn.style.display="none";tbAv.style.display="none";
    title.textContent=name==="newchat"?"New Message":"New Group";
  }
};

window.goBack=function(){showScreen("convs");};

function showEmptyConvs(el){
  el.innerHTML='<div style="text-align:center;padding:40px;">'
    +'<div style="font-size:2rem;margin-bottom:12px;">&#128172;</div>'
    +'<div style="font-weight:700;font-size:0.82rem;color:var(--text);margin-bottom:8px;">Start a Conversation</div>'
    +'<div style="font-size:0.72rem;color:var(--muted);margin-bottom:16px;">Tap &#9998; below to message any ICONIK member privately.</div>'
    +'<button id="_startMsgBtn" style="padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:Sora,sans-serif;font-weight:700;font-size:0.76rem;cursor:pointer;">&#9998; New Message</button>'
    +'</div>';
  var b=document.getElementById("_startMsgBtn");
  if(b)b.onclick=function(){showScreen("newchat");};
}

function loadConvs(){
  if(!cU)return;
  var el=document.getElementById("convList");
  if(convUnsub)convUnsub();
  try{
    convUnsub=onSnapshot(
      query(collection(db,"conversations"),where("members","array-contains",cU.uid),limit(50)),
      function(snap){
        allConvs=[];
        snap.forEach(function(d){allConvs.push({id:d.id,...d.data()});});
        allConvs.sort(function(a,b){
          var at=a.lastMessageAt&&a.lastMessageAt.seconds||0;
          var bt=b.lastMessageAt&&b.lastMessageAt.seconds||0;
          return bt-at;
        });
        renderConvs(allConvs);
      },
      function(err){
        console.warn("Convs error:",err);
        showEmptyConvs(el);
      }
    );
  }catch(e){showEmptyConvs(el);}
}

function renderConvs(list){
  var el=document.getElementById("convList");
  if(!list.length){el.innerHTML="<div style='text-align:center;padding:40px;color:var(--muted);font-size:0.76rem;'>No conversations yet.<br>Tap &#9998; to start messaging!</div>";return;}
  var h="";
  list.forEach(function(c){
    var name=getOtherName(c);
    var avatar=getOtherAvatar(c);
    var initials=(name||"?").charAt(0).toUpperCase();
    var unread=c.unread&&c.unread[cU.uid]||0;
    var last=c.lastMessage||"";
    // Use data attributes to avoid nested quote issues
    h+='<div class="ci" data-cid="'+c.id+'" data-cnm="'+xe(name)+'">';
    h+='<div class="cav">';
    if(avatar&&avatar.startsWith("http"))h+='<img src="'+xu(avatar)+'" onerror="this.remove()"/>';
    else h+=initials;
    h+='</div>';
    h+='<div class="cnfo"><div class="cnm">'+xe(name)+(c.type==="group"?" &#128101;":"")+'</div>';
    h+='<div class="clst">'+xe(last.substring(0,50))+'</div></div>';
    h+='<div class="cmeta"><div class="ctim">'+fmtTime(c.lastMessageAt)+'</div>';
    if(unread>0)h+='<div class="cbdg">'+unread+'</div>';
    h+='</div></div>';
  });
  el.innerHTML=h;
  // Event delegation — no nested onclick
  el.onclick=function(ev){
    var item=ev.target.closest(".ci");
    if(!item)return;
    openConv(item.dataset.cid,item.dataset.cnm);
  };
}

function getOtherName(c){
  if(c.type==="group")return c.name||"Group";
  if(!c.memberNames)return"Member";
  var others=Object.keys(c.memberNames).filter(function(id){return id!==cU.uid;});
  return others.length?c.memberNames[others[0]]:"Member";
}
function getOtherAvatar(c){
  if(c.type==="group")return c.avatar||"";
  if(!c.memberAvatars)return"";
  var others=Object.keys(c.memberAvatars).filter(function(id){return id!==cU.uid;});
  return others.length?c.memberAvatars[others[0]]:"";
}

window.filterConvs=function(){
  var q=document.getElementById("convSrch").value.toLowerCase().trim();
  if(!q){renderConvs(allConvs);return;}
  renderConvs(allConvs.filter(function(c){return getOtherName(c).toLowerCase().includes(q);}));
};

window.openConv=async function(cid,name){
  activeCid=cid;
  activeCdata=allConvs.find(function(c){return c.id===cid;})||{};
  var av=activeCdata.avatar||getOtherAvatar(activeCdata);
  document.getElementById("chatNm").textContent=name||getOtherName(activeCdata);
  document.getElementById("chatSt").textContent=activeCdata.type==="group"?((activeCdata.members||[]).length+" members"):"Active";
  document.getElementById("tbTitle").textContent=name||getOtherName(activeCdata);
  var ca=document.getElementById("chatAv");
  if(av&&av.startsWith("http"))ca.innerHTML='<img src="'+xu(av)+'" onerror="this.remove()"/>';
  else ca.innerHTML='<span id="chatAvLtr">'+(name||"?").charAt(0).toUpperCase()+'</span>';
  showScreen("chat");
  try{var upd={};upd["unread."+cU.uid]=0;await updateDoc(doc(db,"conversations",cid),upd);}catch(e){}
  if(msgUnsub)msgUnsub();
  var ml=document.getElementById("msgList");
  ml.innerHTML="<div style='text-align:center;padding:20px;color:var(--muted);font-size:0.72rem;'>Loading...</div>";
  try{
    msgUnsub=onSnapshot(
      query(collection(db,"conversations",cid,"messages"),orderBy("createdAt","asc"),limit(100)),
      function(snap){
        var msgs=[];snap.forEach(function(d){msgs.push({id:d.id,...d.data()});});
        renderMsgs(msgs);
        try{var u={};u["unread."+cU.uid]=0;updateDoc(doc(db,"conversations",cid),u);}catch(e2){}
      },
      function(snapErr){
        console.warn("Messages listener error:",snapErr);
        // Try getDocs fallback
        getDocs(query(collection(db,"conversations",cid,"messages"),limit(50))).then(function(snap2){
          var msgs=[];snap2.forEach(function(d){msgs.push({id:d.id,...d.data()});});
          msgs.sort(function(a,b){return(a.createdAt&&a.createdAt.seconds||0)-(b.createdAt&&b.createdAt.seconds||0);});
          renderMsgs(msgs);
        }).catch(function(){
          var ml2=document.getElementById("msgList");
          if(ml2)ml2.innerHTML="<div style='text-align:center;padding:30px;color:var(--muted);font-size:0.72rem;'>No messages yet. Say hello! &#128075;</div>";
        });
      }
    );
  }catch(e){
    getDocs(query(collection(db,"conversations",cid,"messages"),limit(50))).then(function(snap2){
      var msgs=[];snap2.forEach(function(d){msgs.push({id:d.id,...d.data()});});
      renderMsgs(msgs);
    }).catch(function(){
      var ml2=document.getElementById("msgList");
      if(ml2)ml2.innerHTML="<div style='text-align:center;padding:30px;color:var(--muted);font-size:0.72rem;'>No messages yet. Say hello! &#128075;</div>";
    });
  }
};

function renderMsgs(msgs){
  var el=document.getElementById("msgList");
  if(!msgs.length){el.innerHTML="<div style='text-align:center;padding:30px;color:var(--muted);font-size:0.72rem;'>No messages yet. Say hello! &#128075;</div>";return;}
  var h="";var lastDate="";
  msgs.forEach(function(m){
    var isSent=m.senderId===cU.uid;
    if(m.createdAt&&m.createdAt.seconds){
      var d=new Date(m.createdAt.seconds*1000);
      var ds=d.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"});
      if(ds!==lastDate){h+='<div class="dsep">'+ds+'</div>';lastDate=ds;}
    }
    if(m.type==="system"){h+='<div class="dsep">'+xe(m.text||"")+'</div>';return;}
    h+='<div class="mb '+(isSent?"sent":"recv")+'" data-mid="'+m.id+'">';
    if(!isSent)h+='<div style="font-size:0.58rem;color:var(--accent);margin-bottom:2px;">'+xe(m.senderName||"")+'</div>';
    if(m.type==="image"&&m.mediaUrl){
      h+='<img src="'+xu(m.mediaUrl)+'" class="mimg" onclick="openLb(this.src)" onerror="this.remove()"/>';
    }else if(m.type==="video"&&m.mediaUrl){
      h+='<video src="'+xu(m.mediaUrl)+'" controls playsinline style="width:100%;max-width:240px;border-radius:10px;max-height:200px;" onerror="this.remove()"></video>';
    }else if(m.type==="audio"&&m.mediaUrl){
      h+='<div style="display:flex;align-items:center;gap:8px;">&#127908; <audio controls src="'+xu(m.mediaUrl)+'" style="max-width:180px;height:32px;"></audio></div>';
    }else{
      if(m.text){var lines=xe(m.text).split("\n");h+=lines.join("<br>");}
    }
    h+='<div class="mt">'+fmtFull(m.createdAt)+(isSent?' &#10003;&#10003;':'')+' </div>';
    h+='</div>';
  });
  el.innerHTML=h;
  // Long press to delete own messages
  el.querySelectorAll(".mb.sent").forEach(function(b){
    b.addEventListener("contextmenu",function(e){
      e.preventDefault();
      var mid=b.dataset.mid;
      if(mid&&confirm("Delete this message?")){
        deleteDoc(doc(db,"conversations",activeCid,"messages",mid)).then(function(){mToast("Deleted");}).catch(function(){});
      }
    });
  });
  el.scrollTop=el.scrollHeight;
}

window.sendMsg=async function(){
  if(!cU||!activeCid)return;
  var inp=document.getElementById("msgInput");
  var text=inp.value.trim();if(!text)return;
  inp.value="";inp.style.height="auto";
  try{
    await addDoc(collection(db,"conversations",activeCid,"messages"),{
      senderId:cU.uid,senderName:cD.name||"Member",
      text:text,type:"text",createdAt:serverTimestamp(),readBy:[cU.uid]
    });
    var upd={lastMessage:text,lastMessageAt:serverTimestamp()};
    (activeCdata.members||[]).forEach(function(uid){
      if(uid!==cU.uid)upd["unread."+uid]=((activeCdata.unread&&activeCdata.unread[uid])||0)+1;
    });
    await updateDoc(doc(db,"conversations",activeCid),upd);
  }catch(e){mToast("Error sending");}
};

window.sendImage=async function(inp){
  if(!inp.files||!inp.files[0])return;
  var f=inp.files[0];inp.value="";
  var isVid=f.type.startsWith("video");
  mToast(isVid?"Uploading video...":"Uploading photo...");
  try{
    var fd=new FormData();fd.append("file",f);fd.append("upload_preset","iconik_uploads");
    var endpoint=isVid
      ?"https://api.cloudinary.com/v1_1/dhazrf2xr/video/upload"
      :"https://api.cloudinary.com/v1_1/dhazrf2xr/image/upload";
    var r=await fetch(endpoint,{method:"POST",body:fd});
    var data=await r.json();
    await addDoc(collection(db,"conversations",activeCid,"messages"),{
      senderId:cU.uid,senderName:cD.name||"Member",
      text:"",mediaUrl:data.secure_url,type:isVid?"video":"image",createdAt:serverTimestamp(),readBy:[cU.uid]
    });
    await updateDoc(doc(db,"conversations",activeCid),{lastMessage:isVid?"[Video]":"[Photo]",lastMessageAt:serverTimestamp()});
    mToast(isVid?"Video sent! &#127916;":"Photo sent! &#128247;");
  }catch(e){mToast("Upload failed: "+e.message);}
};

window.handleFile=function(inp){
  inp.value="";
  if(!hasVIP()){
    document.getElementById("dlMsg").textContent="Share videos, voice notes, files and make calls. Download I-Messenger for the full experience.";
    document.getElementById("dlPrm").classList.add("show");
  }else{
    mToast("Full file sharing coming in I-Messenger App update! &#128206;");
  }
};

window.handleMedia=async function(inp){
  if(!inp.files||!inp.files[0])return;
  var f=inp.files[0];inp.value="";
  var isVid=f.type.startsWith("video");
  var isAudio=f.type.startsWith("audio");
  var isPdf=f.name.endsWith(".pdf");
  // Restricted files — prompt download for Fan members
  if((isVid||isAudio||isPdf)&&!hasVIP()){
    document.getElementById("dlMsg").textContent="Share videos, audio and files with I-Messenger. Available for VIP members.";
    document.getElementById("dlPrm").classList.add("show");
    return;
  }
  var endpoint=isVid||isAudio
    ?"https://api.cloudinary.com/v1_1/dhazrf2xr/video/upload"
    :"https://api.cloudinary.com/v1_1/dhazrf2xr/image/upload";
  var msgType=isVid?"video":isAudio?"audio":"image";
  var label=isVid?"Video":isAudio?"Voice":"Photo";
  mToast("Uploading "+label+"...");
  try{
    var fd=new FormData();fd.append("file",f);fd.append("upload_preset","iconik_uploads");
    var r=await fetch(endpoint,{method:"POST",body:fd});
    var data=await r.json();
    if(!data.secure_url)throw new Error("Upload failed");
    await addDoc(collection(db,"conversations",activeCid,"messages"),{
      senderId:cU.uid,senderName:cD.name||"Member",
      text:"",mediaUrl:data.secure_url,type:msgType,
      createdAt:serverTimestamp(),readBy:[cU.uid]
    });
    var upd={lastMessage:"["+label+"]",lastMessageAt:serverTimestamp()};
    (activeCdata.members||[]).forEach(function(uid){
      if(uid!==cU.uid)upd["unread."+uid]=((activeCdata.unread&&activeCdata.unread[uid])||0)+1;
    });
    await updateDoc(doc(db,"conversations",activeCid),upd);
    mToast(label+" sent!");
  }catch(e){mToast("Upload failed: "+e.message);}
};

window.doVoiceNote=async function(){
  if(!hasVIP()){
    document.getElementById("dlMsg").textContent="Record and send voice notes with VIP membership on I-Messenger.";
    document.getElementById("dlPrm").classList.add("show");
    return;
  }
  if(isRec){
    if(mediaRec)mediaRec.stop();
    isRec=false;
    document.getElementById("voiceBtn").textContent="&#127908;";
    return;
  }
  try{
    var stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRec=new MediaRecorder(stream);
    var chunks=[];
    mediaRec.ondataavailable=function(e){chunks.push(e.data);};
    mediaRec.onstop=async function(){
      var blob=new Blob(chunks,{type:"audio/webm"});
      var fd=new FormData();fd.append("file",blob,"voice.webm");fd.append("upload_preset","iconik_uploads");
      mToast("Sending voice note...");
      try{
        var r=await fetch("https://api.cloudinary.com/v1_1/dhazrf2xr/video/upload",{method:"POST",body:fd});
        var data=await r.json();
        await addDoc(collection(db,"conversations",activeCid,"messages"),{
          senderId:cU.uid,senderName:cD.name||"Member",
          text:"",mediaUrl:data.secure_url,type:"audio",createdAt:serverTimestamp(),readBy:[cU.uid]
        });
        await updateDoc(doc(db,"conversations",activeCid),{lastMessage:"&#127908; Voice note",lastMessageAt:serverTimestamp()});
        mToast("Voice note sent! &#127908;");
      }catch(e2){mToast("Upload failed");}
      stream.getTracks().forEach(function(t){t.stop();});
    };
    mediaRec.start();isRec=true;
    document.getElementById("voiceBtn").textContent="&#9209;&#65039;";
    mToast("Recording... tap to stop");
  }catch(e){mToast("Microphone access denied");}
};

window.doCall=function(type){startCall(type);};
window.startCall=function(type){
  if(!hasVIP()){
    document.getElementById("dlMsg").textContent="Make voice and video calls with VIP membership on I-Messenger.";
    document.getElementById("dlPrm").classList.add("show");
    return;
  }
  var name=document.getElementById("chatNm").textContent;
  document.getElementById("callNm").textContent=name;
  document.getElementById("callSt").textContent=type==="video"?"Video Call...":"Voice Call...";
  document.getElementById("callIco").textContent=type==="video"?"&#128249;":"&#128222;";
  document.getElementById("callScr").classList.add("active");
  mToast("Calling "+name+"...");
};
window.endCall=function(){document.getElementById("callScr").classList.remove("active");mToast("Call ended");};

function loadMembers(){
  if(!cU)return;
  getDocs(query(collection(db,"users"),limit(100))).then(function(snap){
    allMembers=[];
    snap.forEach(function(d){
      if(d.id!==cU.uid){
        var dd=d.data();
        allMembers.push({id:d.id,name:dd.name||dd.displayName||"Member",profilePic:dd.profilePic||dd.photoURL||"",tier:dd.tier||"Fan",city:dd.city||"",country:dd.country||""});
      }
    });
  }).catch(function(){});
}

window.searchMembers=function(){
  var q=document.getElementById("memberSrch").value.toLowerCase().trim();
  var el=document.getElementById("memberList");
  // Show all members if no query, filter if query
  var f=q
    ?allMembers.filter(function(m){
        return(m.name||"").toLowerCase().includes(q)||(m.country||"").toLowerCase().includes(q)||(m.city||"").toLowerCase().includes(q);
      })
    :allMembers;
  if(!f.length){
    el.innerHTML="<div style='text-align:center;padding:24px;color:var(--muted);font-size:0.76rem;'>"+(allMembers.length===0?"Loading members...":"No members found")+"</div>";
    return;
  }
  var h="";
  f.forEach(function(m){
    h+='<div class="ci" data-uid="'+m.id+'" data-nm="'+xe(m.name||"Member")+'" data-av="'+xe(m.profilePic||"")+'">';
    h+='<div class="cav">';
    if(m.profilePic&&m.profilePic.startsWith("http"))h+='<img src="'+xu(m.profilePic)+'" onerror="this.remove()"/>';
    else h+='<span style="font-size:1.1rem;font-weight:700;color:#fff;">'+(m.name||"M").charAt(0).toUpperCase()+'</span>';
    h+='</div><div class="cnfo"><div class="cnm">'+xe(m.name||"Member")+'</div>';
    h+='<div class="clst">'+xe(m.tier||"Fan")+(m.city?" · "+xe(m.city):"")+(m.country?" · "+xe(m.country):"")+'</div></div>';
    h+='<div style="font-size:0.62rem;color:var(--accent);font-weight:700;">Message &#128172;</div>';
    h+='</div>';
  });
  el.innerHTML=h;
  el.onclick=function(ev){
    var item=ev.target.closest(".ci[data-uid]");
    if(!item)return;
    startDirect(item.dataset.uid,item.dataset.nm,item.dataset.av);
  };
};

window.startDirect=async function(uid2,name2,av2){
  var existing=allConvs.find(function(c){return c.type!=="group"&&c.members&&c.members.includes(uid2)&&c.members.includes(cU.uid);});
  if(existing){openConv(existing.id,name2);return;}
  try{
    var names={};names[cU.uid]=cD.name||"Member";names[uid2]=name2;
    var avs={};avs[cU.uid]=cD.profilePic||"";avs[uid2]=av2||"";
    var ref=await addDoc(collection(db,"conversations"),{
      type:"direct",members:[cU.uid,uid2],memberNames:names,memberAvatars:avs,
      lastMessage:"",lastMessageAt:serverTimestamp(),unread:{},createdAt:serverTimestamp()
    });
    openConv(ref.id,name2);
  }catch(e){mToast("Error: "+e.message);}
};

window.searchGrpMembers=function(){
  var q=document.getElementById("grpSrch").value.toLowerCase().trim();
  var el=document.getElementById("grpMbrList");
  if(!q){el.innerHTML="";return;}
  var f=allMembers.filter(function(m){return(m.name||"").toLowerCase().includes(q)&&!grpSel.find(function(s){return s.id===m.id;});});
  var h="";
  f.forEach(function(m){
    h+='<div class="ci" data-uid="'+m.id+'" data-nm="'+xe(m.name||"Member")+'">';
    h+='<div class="cav">';
    if(m.profilePic&&m.profilePic.startsWith("http"))h+='<img src="'+xu(m.profilePic)+'" onerror="this.remove()"/>';
    else h+=(m.name||"M").charAt(0).toUpperCase();
    h+='</div><div class="cnfo"><div class="cnm">'+xe(m.name||"Member")+'</div></div></div>';
  });
  el.innerHTML=h;
  el.onclick=function(ev){
    var item=ev.target.closest(".ci[data-uid]");
    if(!item)return;
    addToGrp(item.dataset.uid,item.dataset.nm);
  };
};

window.addToGrp=function(uid,name){
  if(grpSel.find(function(m){return m.id===uid;}))return;
  grpSel.push({id:uid,name:name});
  renderChips();
  document.getElementById("grpSrch").value="";
  document.getElementById("grpMbrList").innerHTML="";
};

function renderChips(){
  var el=document.getElementById("grpChips");
  var h="";
  grpSel.forEach(function(m){
    h+='<span class="mchip">'+xe(m.name)+'<span class="_rmchip" data-uid="'+m.id+'" style="color:var(--err);cursor:pointer;margin-left:3px;">x</span></span>';
  });
  el.innerHTML=h;
  el.onclick=function(ev){
    var sp=ev.target.closest("._rmchip");
    if(sp)rmFromGrp(sp.dataset.uid);
  };
}

window.rmFromGrp=function(uid){grpSel=grpSel.filter(function(m){return m.id!==uid;});renderChips();};

window.createGroup=async function(){
  var name=document.getElementById("grpName").value.trim();
  if(!name){mToast("Enter a group name");return;}
  if(!grpSel.length){mToast("Add at least one member");return;}
  var members=[cU.uid].concat(grpSel.map(function(m){return m.id;}));
  var names={};names[cU.uid]=cD.name||"Member";
  grpSel.forEach(function(m){names[m.id]=m.name;});
  try{
    var ref=await addDoc(collection(db,"conversations"),{
      type:"group",name:name,members:members,memberNames:names,
      admins:[cU.uid],lastMessage:"Group created",
      lastMessageAt:serverTimestamp(),unread:{},createdAt:serverTimestamp()
    });
    await addDoc(collection(db,"conversations",ref.id,"messages"),{
      senderId:cU.uid,senderName:cD.name||"Member",
      text:(cD.name||"Member")+" created the group",type:"system",createdAt:serverTimestamp(),readBy:[cU.uid]
    });
    grpSel=[];document.getElementById("grpName").value="";
    mToast("Group created! &#128101;");
    openConv(ref.id,name);
  }catch(e){mToast("Error: "+e.message);}
};

window.toggleEmoji=function(){document.getElementById("emojiPicker").classList.toggle("show");};
window.insEmoji=function(e){var i=document.getElementById("msgInput");i.value+=e;i.focus();document.getElementById("emojiPicker").classList.remove("show");};
window.onKey=function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}};
window.autoResize=function(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,100)+"px";};

window.openLb=function(src){
  var m=document.createElement("div");
  m.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:99999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;";
  m.innerHTML='<img src="'+src+'" style="max-width:96vw;max-height:90vh;border-radius:8px;object-fit:contain;"/>';
  m.onclick=function(){m.remove();};
  document.body.appendChild(m);
};

window.installPWA=function(){
  if(window._pwaP){window._pwaP.prompt();document.getElementById("dlPrm").classList.remove("show");}
  else{mToast("Tap browser menu > Add to Home Screen &#128241;");document.getElementById("dlPrm").classList.remove("show");}
};
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window._pwaP=e;});
