<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ICONIK — Sign In</title>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#07070D"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Bebas+Neue&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:#07070D;color:#F5F0E8;font-family:"Montserrat",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,184,0,0.07),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(201,149,106,0.05),transparent 50%);pointer-events:none;}
.logo{font-family:"Bebas Neue",sans-serif;font-size:3rem;letter-spacing:0.1em;background:linear-gradient(145deg,#d4956a 0%,#e8b090 25%,#f5c9a8 45%,#e8b090 65%,#c97850 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 25px rgba(212,149,106,0.4));margin-bottom:6px;text-align:center;}
.tagline{font-family:"Playfair Display",serif;font-style:italic;font-size:0.84rem;color:#BDB5A6;text-align:center;margin-bottom:32px;}
.card{width:100%;max-width:400px;background:#0E0E1A;border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:28px 24px;position:relative;z-index:1;}
.tabs{display:flex;border-bottom:1px solid rgba(255,255,255,0.09);margin-bottom:24px;}
.tab{flex:1;padding:10px;text-align:center;font-family:"Bebas Neue",sans-serif;font-size:0.72rem;letter-spacing:0.14em;color:#BDB5A6;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;}
.tab.active{color:#FFB800;border-bottom-color:#FFB800;}
.form{display:none;}.form.active{display:block;}
.fg{margin-bottom:14px;}
.fl{font-family:"Bebas Neue",sans-serif;font-size:0.6rem;letter-spacing:0.16em;color:#BDB5A6;margin-bottom:5px;display:block;}
.fi{width:100%;padding:12px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:8px;color:#F5F0E8;font-family:"Montserrat",sans-serif;font-size:0.78rem;outline:none;transition:border-color 0.2s;}
.fi:focus{border-color:#FFB800;}
.fi::placeholder{color:rgba(189,181,166,0.4);}
select.fi option{background:#0E0E1A;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-family:"Bebas Neue",sans-serif;font-size:0.58rem;letter-spacing:0.1em;padding:5px 10px;border:1px solid rgba(255,255,255,0.09);border-radius:4px;cursor:pointer;color:#BDB5A6;transition:all 0.2s;background:transparent;}
.chip.on{background:rgba(255,184,0,0.15);border-color:#FFB800;color:#FFB800;}
.btn-main{width:100%;padding:13px;font-family:"Montserrat",sans-serif;font-weight:800;font-size:0.76rem;letter-spacing:0.16em;text-transform:uppercase;background:linear-gradient(135deg,#FFB800,#CC9400);color:#07070D;border:none;border-radius:8px;cursor:pointer;margin-top:6px;transition:all 0.25s;}
.btn-main:disabled{opacity:0.55;cursor:not-allowed;}
.btn-back{width:100%;padding:13px;font-family:"Montserrat",sans-serif;font-weight:700;font-size:0.72rem;background:rgba(255,255,255,0.06);color:#F5F0E8;border:1px solid rgba(255,255,255,0.12);border-radius:8px;cursor:pointer;margin-top:6px;}
.btn-link{background:none;border:none;color:#FFB800;font-family:"Montserrat",sans-serif;font-size:0.68rem;cursor:pointer;margin-top:12px;display:block;text-align:center;}
.step{display:none;}.step.active{display:block;}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:20px;}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.09);transition:all 0.2s;}
.dot.on{background:#FFB800;}
.msg{font-family:"Montserrat",sans-serif;font-size:0.7rem;padding:10px 12px;border-radius:6px;margin-bottom:12px;display:none;}
.msg.err{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#FCA5A5;display:block;}
.msg.ok{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);color:#86EFAC;display:block;}
#ov{position:fixed;inset:0;background:#07070D;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.ring{width:32px;height:32px;border:3px solid rgba(255,184,0,0.2);border-top-color:#FFB800;border-radius:50%;animation:sp 0.8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.ring-sm{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,0.3);border-top-color:#07070D;border-radius:50%;animation:sp 0.7s linear infinite;vertical-align:middle;margin-right:6px;}
.ov-txt{font-family:"Bebas Neue",sans-serif;font-size:0.7rem;letter-spacing:0.2em;color:#BDB5A6;}
</style>
</head>
<body>

<div id="ov"><div class="ring"></div><div class="ov-txt">Loading ICONIK...</div></div>

<div class="logo">ICONIK</div>
<div class="tagline">The Global Fan Authority</div>

<div class="card">
  <div class="tabs">
    <div class="tab active" id="tLogin" onclick="sTab('login')">Sign In</div>
    <div class="tab" id="tReg" onclick="sTab('register')">Join Free</div>
  </div>

  <div class="form active" id="fLogin">
    <div class="msg" id="mLogin"></div>
    <div class="fg"><label class="fl">Email</label><input class="fi" type="email" id="lEmail" placeholder="your@email.com" autocomplete="email"/></div>
    <div class="fg"><label class="fl">Password</label><input class="fi" type="password" id="lPass" placeholder="••••••••" autocomplete="current-password"/></div>
    <button class="btn-main" id="lBtn" onclick="doLogin()">Sign In</button>
    <button class="btn-link" onclick="sTab('reset')">Forgot password?</button>
    <button class="btn-link" onclick="sTab('register')">New to ICONIK? Join free</button>
  </div>

  <div class="form" id="fRegister">
    <div class="msg" id="mReg"></div>
    <div class="dots"><div class="dot on" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>
    <div class="step active" id="s1">
      <div class="fg"><label class="fl">Full Name *</label><input class="fi" type="text" id="rNm" placeholder="Your full name"/></div>
      <div class="fg"><label class="fl">Email *</label><input class="fi" type="email" id="rEm" placeholder="your@email.com"/></div>
      <div class="fg"><label class="fl">Password * (min 6 chars)</label><input class="fi" type="password" id="rPw" placeholder="••••••••"/></div>
      <button class="btn-main" onclick="goStep(2)">Continue</button>
    </div>
    <div class="step" id="s2">
      <div class="fg"><label class="fl">Country *</label>
        <select class="fi" id="rCo">
          <option value="">Select country...</option>
          <option>Nigeria</option><option>Ghana</option><option>Kenya</option><option>South Africa</option>
          <option>United States</option><option>United Kingdom</option><option>Canada</option><option>Australia</option>
          <option>Brazil</option><option>India</option><option>Jamaica</option><option>Trinidad and Tobago</option>
          <option>Puerto Rico</option><option>France</option><option>Germany</option><option>Spain</option>
          <option>Mexico</option><option>Argentina</option><option>Colombia</option><option>Other</option>
        </select>
      </div>
      <div class="fg"><label class="fl">City</label><input class="fi" type="text" id="rCi" placeholder="Your city"/></div>
      <div class="fg"><label class="fl">Membership</label>
        <select class="fi" id="rTi">
          <option value="Fan">Fan Member — Free Forever</option>
          <option value="VIP Silver">VIP Silver — $9.99/month</option>
          <option value="VIP Gold">VIP Gold — $19.99/month</option>
        </select>
      </div>
      <button class="btn-main" onclick="goStep(3)">Continue</button>
      <button class="btn-back" onclick="goStep(1)">Back</button>
    </div>
    <div class="step" id="s3">
      <div class="fg"><label class="fl">Choose Communities (1-5) *</label>
        <div class="chips">
          <div class="chip" data-c="Music" onclick="tChip(this)">Music</div>
          <div class="chip" data-c="Film &amp; TV" onclick="tChip(this)">Film &amp; TV</div>
          <div class="chip" data-c="Sports" onclick="tChip(this)">Sports</div>
          <div class="chip" data-c="Fashion" onclick="tChip(this)">Fashion</div>
          <div class="chip" data-c="Fitness &amp; Wellness" onclick="tChip(this)">Wellness</div>
          <div class="chip" data-c="Literature" onclick="tChip(this)">Literature</div>
          <div class="chip" data-c="Food &amp; Culinary" onclick="tChip(this)">Food</div>
          <div class="chip" data-c="Nature" onclick="tChip(this)">Nature</div>
          <div class="chip" data-c="Automotive" onclick="tChip(this)">Auto</div>
          <div class="chip" data-c="Tech &amp; Innovation" onclick="tChip(this)">Tech</div>
          <div class="chip" data-c="Beauty" onclick="tChip(this)">Beauty</div>
          <div class="chip" data-c="Entertainment" onclick="tChip(this)">Entertainment</div>
          <div class="chip" data-c="Leadership" onclick="tChip(this)">Leadership</div>
        </div>
      </div>
      <button class="btn-main" id="rBtn" onclick="doRegister()">Join ICONIK</button>
      <button class="btn-back" onclick="goStep(2)">Back</button>
    </div>
  </div>

  <div class="form" id="fReset">
    <div class="msg" id="mReset"></div>
    <div class="fg"><label class="fl">Email Address</label><input class="fi" type="email" id="rEmail" placeholder="your@email.com"/></div>
    <button class="btn-main" onclick="doReset()">Send Reset Link</button>
    <button class="btn-link" onclick="sTab('login')">Back to Sign In</button>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyCnX9DszicduSwsFwBZ_iTLI47NPeXkteE",authDomain:"iconik-global.firebaseapp.com",projectId:"iconik-global",storageBucket:"iconik-global.firebasestorage.app",messagingSenderId:"1040054516979",appId:"1:1040054516979:web:33cd5f07ae8fc146a30b86"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const ADMIN="iconikglobal01@gmail.com";
const ov=document.getElementById("ov");
let resolved=false;
setTimeout(()=>{if(!resolved){ov.style.display="none";}},5000);
onAuthStateChanged(auth,async u=>{
  resolved=true;
  if(u){
    if(u.email===ADMIN){location.href="admin.html";return;}
    try{
      const d=await getDoc(doc(db,"users",u.uid));
      if(d.exists()){
        const r=d.data().role||"member";
        location.href=(r==="admin"||r==="Sub Admin"||r==="Moderator")?"admin.html":"dashboard.html";
        return;
      }
    }catch(e){console.log(e);}
    location.href="dashboard.html";
  }else{ov.style.display="none";}
});
window.sTab=function(t){
  document.querySelectorAll(".form").forEach(f=>f.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(tb=>tb.classList.remove("active"));
  document.getElementById("f"+t.charAt(0).toUpperCase()+t.slice(1)).classList.add("active");
  const te=document.getElementById("t"+t.charAt(0).toUpperCase()+t.slice(1));
  if(te)te.classList.add("active");
  document.querySelectorAll(".msg").forEach(m=>{m.className="msg";m.textContent="";});
};
window.goStep=function(n){
  if(n===2){
    const nm=document.getElementById("rNm").value.trim();
    const em=document.getElementById("rEm").value.trim();
    const pw=document.getElementById("rPw").value;
    if(!nm){msg("mReg","Enter your full name","err");return;}
    if(!em||!em.includes("@")){msg("mReg","Enter a valid email","err");return;}
    if(pw.length<6){msg("mReg","Password must be at least 6 characters","err");return;}
  }
  if(n===3&&!document.getElementById("rCo").value){msg("mReg","Please select your country","err");return;}
  document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"));
  document.getElementById("s"+n).classList.add("active");
  for(let i=1;i<=3;i++){const d=document.getElementById("d"+i);if(d)d.className="dot"+(i<=n?" on":"");}
  document.querySelectorAll(".msg").forEach(m=>{m.className="msg";m.textContent="";});
};
window.tChip=function(el){
  const sel=document.querySelectorAll(".chip.on");
  if(el.classList.contains("on")){el.classList.remove("on");}
  else if(sel.length>=5){msg("mReg","Maximum 5 communities","err");}
  else{el.classList.add("on");}
};
window.doRegister=async function(){
  const cats=[...document.querySelectorAll(".chip.on")].map(c=>c.dataset.c);
  if(!cats.length){msg("mReg","Select at least 1 community","err");return;}
  const btn=document.getElementById("rBtn");
  btn.disabled=true;btn.innerHTML="<span class=ring-sm></span>Creating...";
  try{
    const name=document.getElementById("rNm").value.trim();
    const email=document.getElementById("rEm").value.trim();
    const pass=document.getElementById("rPw").value;
    const country=document.getElementById("rCo").value;
    const city=document.getElementById("rCi").value.trim();
    const tier=document.getElementById("rTi").value;
    const{user}=await createUserWithEmailAndPassword(auth,email,pass);
    await setDoc(doc(db,"users",user.uid),{
      name,email,country,city,tier,categories:cats,
      profilePic:"",coverPhoto:"",bio:"",
      verificationStatus:"pending",followersCount:0,followingCount:0,
      postCount:0,likeCount:0,points:0,role:"member",
      joinedAt:serverTimestamp()
    });
    location.href="dashboard.html";
  }catch(e){msg("mReg",ferr(e.code),"err");btn.disabled=false;btn.textContent="Join ICONIK";}
};
window.doLogin=async function(){
  const email=document.getElementById("lEmail").value.trim();
  const pass=document.getElementById("lPass").value;
  if(!email||!email.includes("@")){msg("mLogin","Enter a valid email address","err");return;}
  if(!pass){msg("mLogin","Enter your password","err");return;}
  const btn=document.getElementById("lBtn");
  btn.disabled=true;btn.innerHTML="<span class=ring-sm></span>Signing in...";
  try{await signInWithEmailAndPassword(auth,email,pass);}
  catch(e){msg("mLogin",ferr(e.code),"err");btn.disabled=false;btn.textContent="Sign In";}
};
window.doReset=async function(){
  const email=document.getElementById("rEmail").value.trim();
  if(!email){msg("mReset","Enter your email","err");return;}
  try{await sendPasswordResetEmail(auth,email);msg("mReset","Reset link sent! Check your inbox.","ok");}
  catch(e){msg("mReset",ferr(e.code),"err");}
};
function msg(id,text,type){const el=document.getElementById(id);if(el){el.textContent=text;el.className="msg "+type;}}
function ferr(code){
  const m={"auth/user-not-found":"No account with this email.","auth/wrong-password":"Wrong password.","auth/invalid-credential":"Wrong email or password.","auth/email-already-in-use":"Email already registered.","auth/weak-password":"Password must be 6+ characters.","auth/invalid-email":"Invalid email address.","auth/too-many-requests":"Too many attempts. Try again later.","auth/network-request-failed":"Network error. Check your connection."};
  return m[code]||"Something went wrong. Try again.";
}
document.getElementById("lPass").onkeydown=e=>{if(e.key==="Enter")doLogin();};
document.getElementById("lEmail").onkeydown=e=>{if(e.key==="Enter")doLogin();};
</script>
</body>
</html>
