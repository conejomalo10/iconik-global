<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ICONIK — My Dashboard</title>
<meta name="description" content="ICONIK Global Fans Community — Your Favorite Celebrity's Platform"/>
<meta name="theme-color" content="#FFB800"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ICONIK"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;600;800;900&family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--obs:#07070D;--obs2:#0F0F1A;--obs3:#141420;--gold:#FFB800;--gg:#FF9500;--gl:#FFD060;--ch:#F5F0E8;--cd:#BDB5A6;--gb:rgba(255,184,0,0.04);--gbr:rgba(255,184,0,0.15);--gbri:rgba(255,184,0,0.4);--ok:#22C55E;--err:#EF4444;--ab:#3B82F6;--warn:#F59E0B;--purple:#8B5CF6;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--obs);color:var(--ch);font-family:'Inter',sans-serif;overflow-x:hidden;min-height:100vh;}
/* PWA INSTALL BANNER */
.pwa-banner{display:none;position:fixed;bottom:0;left:0;right:0;z-index:5000;background:linear-gradient(135deg,var(--obs3),var(--obs2));border-top:1px solid var(--gbri);padding:14px 16px;align-items:center;gap:12px;}
.pwa-banner.show{display:flex;}
.pwa-icon{font-size:1.8rem;}
.pwa-text{flex:1;}
.pwa-title{font-family:'Montserrat',sans-serif;font-weight:800;font-size:0.78rem;color:var(--ch);letter-spacing:0.05em;}
.pwa-sub{font-family:'Inter',sans-serif;font-size:0.66rem;color:var(--cd);margin-top:2px;}
.pwa-btns{display:flex;gap:7px;}
.pwa-install{font-family:'Montserrat',sans-serif;font-weight:800;font-size:0.62rem;letter-spacing:0.1em;padding:7px 13px;background:var(--gold);color:var(--obs);border:none;cursor:pointer;}
.pwa-dismiss{font-family:'Inter',sans-serif;font-size:0.62rem;padding:7px 10px;background:transparent;color:var(--cd);border:1px solid var(--gbr);cursor:pointer;}
/* AUTH */
.auth-pg{display:none;min-height:100vh;background:linear-gradient(135deg,var(--obs),#0A0A14,var(--obs));align-items:center;justify-content:center;padding:16px;}
.auth-pg.on{display:flex;}
.dash-pg{display:none;}
.dash-pg.on{display:block;}
.abox{width:100%;max-width:480px;background:var(--obs3);border:1px solid var(--gbr);padding:32px 24px;box-shadow:0 40px 120px rgba(0,0,0,0.6);animation:fu 0.4s ease;}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.alogo{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:0.15em;color:var(--gold);text-align:center;text-shadow:0 0 30px rgba(255,184,0,0.4);margin-bottom:5px;display:block;text-decoration:none;}
.alogo span{color:var(--ch);}
.asub{font-family:'Inter',sans-serif;font-size:0.74rem;color:var(--cd);text-align:center;margin-bottom:20px;}
.atabs{display:flex;border-bottom:1px solid var(--gbr);margin-bottom:18px;}
.atab{flex:1;padding:10px;text-align:center;cursor:pointer;font-family:'Montserrat',sans-serif;font-size:0.63rem;font-weight:700;letter-spacing:0.11em;text-transform:uppercase;color:var(--cd);border-bottom:2px solid transparent;transition:all 0.3s;margin-bottom:-1px;}
.atab.on{color:var(--gold);border-bottom-color:var(--gold);}
.vnotice{background:linear-gradient(135deg,rgba(245,158,11,0.08),rgba(255,184,0,0.04));border:1px solid rgba(245,158,11,0.25);border-left:4px solid var(--warn);padding:13px;margin-bottom:16px;}
.vnotice-t{font-family:'Montserrat',sans-serif;font-weight:800;font-size:0.61rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px;}
.vnotice p{font-family:'Inter',sans-serif;font-size:0.69rem;color:var(--cd);line-height:1.6;}
.vnotice strong{color:var(--ch);}
.fg{margin-bottom:12px;}
.fl{font-family:'Montserrat',sans-serif;font-size:0.57rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--cd);margin-bottom:5px;display:block;}
.req{color:var(--err);}
.fi,.fs{width:100%;padding:10px 12px;background:rgba(255,255,255,0.04);border:1px solid var(--gbr);color:var(--ch);font-family:'Inter',sans-serif;font-size:0.81rem;outline:none;transition:all 0.3s;}
.fi:focus,.fs:focus{border-color:var(--gold);}
.fi::placeholder{color:rgba(189,181,166,0.3);}
.fs option{background:var(--obs3);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fhint{font-family:'Inter',sans-serif;font-size:0.6rem;color:rgba(189,181,166,0.4);margin-top:3px;}
.idbox{background:rgba(255,184,0,0.04);border:1px solid var(--gbr);border-left:3px solid var(--gold);padding:12px;margin-bottom:12px;}
.idbox-t{font-family:'Montserrat',sans-serif;font-weight:800;font-size:0.59rem;letter-spacing:0.13em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.idopts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.idopt{padding:7px 10px;border:1px solid var(--gbr);cursor:pointer;font-family:'Inter',sans-serif;font-size:0.67rem;color:var(--cd);transition:all 0.3s;}
.idopt.on{border-color:var(--gold);background:rgba(255,184,0,0.08);color:var(--gold);}
.catg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px;}
.cc{padding:7px 3px;text-align:center;border:1px solid var(--gbr);cursor:pointer;transition:all 0.3s;}
.cc:hover,.cc.on{border-color:var(--gold);background:rgba(255,184,0,0.08);}
.cc-i{font-size:0.95rem;display:block;margin-bottom:2px;}
.cc-n{font-family:'Inter',sans-serif;font-size:0.49rem;color:var(--cd);}
.cc.on .cc-n{color:var(--gold);}
.btn{width:100%;padding:11px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:0.67rem;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;border:none;transition:all 0.3s;}
.btn-g{background:linear-gradient(135deg,var(--gold),var(--gg));color:var(--obs);clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);box-shadow:0 0 25px rgba(255,184,0,0.2);}
.btn-g:hover{box-shadow:0 0 45px rgba(255,184,0,0.4);}
.btn-sm{width:auto;padding:6px 11px;font-size:0.57rem;}
.btn-o{background:transparent;border:1px solid var(--gbri);color:var(--ch);}
.amsg{font-family:'Inter',sans-serif;font-size:0.71rem;text-align:center;margin-top:10px;padding:8px;display:none;}
.amsg.err{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--err);}
.amsg.ok{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:var(--ok);}
/* TOPNAV */
.tnav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,7,13,0.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--gbr);}
.nlogo{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:0.13em;color:var(--gold);text-decoration:none;text-shadow:0 0 20px rgba(255,184,0,0.4);}
.nlogo span{color:var(--ch);}
.nr{display:flex;align-items:center;gap:7px;}
.nun{font-family:'Inter',sans-serif;font-size:0.68rem;color:var(--cd);}
.nav-av{width:29px;height:29px;background:linear-gradient(135deg,var(--gold),var(--gg));border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:0.78rem;color:var(--obs);cursor:pointer;}
.hbg{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;gap:3px;}
.hbg span{display:block;width:16px;height:2px;background:var(--gold);}
/* SIDEBAR */
.sb{position:fixed;top:0;left:-282px;width:282px;height:100vh;background:var(--obs3);border-right:1px solid var(--gbr);z-index:2000;transition:left 0.3s;overflow-y:auto;}
.sb.on{left:0;}
.sb-ov{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1999;display:none;}
.sb-ov.on{display:block;}
.sb-h{padding:14px;border-bottom:1px solid var(--gbr);display:flex;align-items:center;justify-content:space-between;}
.sb-logo{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:0.1em;color:var(--gold);}
.sb-x{background:none;border:none;color:var(--cd);font-size:0.95rem;cursor:pointer;}
.sb-u{padding:12px 15px;border-bottom:1px solid var(--gbr);}
.sb-av{width:40px;height:40px;background:linear-gradient(135deg,var(--gold),var(--gg));border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:0.95rem;color:var(--obs);margin-bottom:5px;}
.sb-nm{font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.76rem;color:var(--ch);margin-bottom:3px;}
.sb-tier{display:inline-block;font-family:'Bebas Neue',sans-serif;font-size:0.54rem;letter-spacing:0.08em;color:var(--obs);background:var(--gold);padding:2px 6px;}
.sb-vs{display:inline-block;font-family:'Bebas Neue',sans-serif;font-size:0.52rem;letter-spacing:0.07em;color:var(--obs);background:var(--ok);padding:2px 6px;margin-left:3px;}
.sb-nav{padding:8px 0;}
.sb-sec{font-family:'Bebas Neue',sans-serif;font-size:0.52rem;letter-spacing:0.23em;color:rgba(189,181,166,0.28);padding:4px 15px 2px;}
.sb-lnk{display:flex;align-items:center;gap:7px;padding:9px 15px;cursor:pointer;font-family:'Inter',sans-serif;font-size:0.74rem;color:var(--cd);transition:all 0.2s;border-left:3px solid transparent;}
.sb-lnk:hover,.sb-lnk.on{color:var(--gold);background:var(--gb);border-left-color:var(--gold);}
.sb-ic{font-size:0.85rem;width:15px;text-align:center;}
.sb-bdg{margin-left:auto;font-family:'Bebas Neue',sans-serif;font-size:0.5rem;background:var(--gold);color:var(--obs);padding:1px 5px;}
.sb-new{margin-left:auto;font-family:'Bebas Neue',sans-serif;font-size:0.5rem;background:var(--err);color:#fff;padding:1px 5px;border-radius:2px;}
/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:999;background:rgba(7,7,13,0.96);backdrop-filter:blur(20px);border-top:1px solid var(--gbr);display:flex;padding:6px 0;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0;cursor:pointer;transition:all 0.2s;}
.bnav-item.on .bnav-ic,.bnav-item.on .bnav-lbl{color:var(--gold);}
.bnav-ic{font-size:1.1rem;margin-bottom:2px;}
.bnav-lbl{font-family:'Montserrat',sans-serif;font-size:0.48rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--cd);}
/* MAIN */
.main{padding:62px 13px 80px;}
.view{display:none;}
.view.on{display:block;}
/* WELCOME */
.wbar{background:linear-gradient(135deg,rgba(255,184,0,0.08),rgba(255,149,0,0.04));border:1px solid var(--gbr);padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.wi{font-size:1.5rem;}
.wh{font-family:'Playfair Display',serif;font-weight:700;font-size:1.05rem;color:var(--ch);}
.ws{font-family:'Inter',sans-serif;font-size:0.68rem;color:var(--cd);margin-top:2px;}
/* VERIFICATION BANNER */
.vbanner{padding:9px 13px;margin-bottom:13px;font-family:'Inter',sans-serif;font-size:0.72rem;display:flex;align-items:center;gap:7px;display:none;}
.vbanner.pending{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);color:var(--warn);display:flex;}
.vbanner.verified{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);color:var(--ok);display:flex;}
.vbanner.rejected{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);color:var(--err);display:flex;}
/* STATS */
.srow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px;}
.sbox{background:var(--gb);border:1px solid var(--gbr);padding:10px;text-align:center;}
.snum{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--gold);}
.slbl{font-family:'Inter',sans-serif;font-size:0.5rem;color:var(--cd);letter-spacing:0.08em;text-transform:uppercase;margin-top:1px;}
/* SECTION HEAD */
.sh{font-family:'Montserrat',sans-serif;font-weight:800;font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:5px;}
.sh::after{content:'';flex:1;height:1px;background:var(--gbr);}
/* CELEB CARDS */
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:14px;}
.ccard{background:var(--gb);border:1px solid var(--gbr);overflow:hidden;transition:all 0.3s;cursor:pointer;}
.ccard:hover{border-color:var(--gbri);transform:translateY(-2px);}
.cimg{width:100%;height:100px;background:var(--obs2);display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden;}
.cimg img{width:100%;height:100%;object-fit:cover;}
.ci{padding:8px;}
.cn{font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.72rem;color:var(--ch);}
.ccat{font-family:'Bebas Neue',sans-serif;font-size:0.54rem;letter-spacing:0.09em;color:var(--gold);margin-top:2px;}
.cmeta{font-family:'Inter',sans-serif;font-size:0.58rem;color:var(--cd);margin-top:2px;}
/* POSTS */
.pcard{background:var(--gb);border:1px solid var(--gbr);padding:14px;margin-bottom:7px;transition:border-color 0.2s;}
.pcard:hover{border-color:var(--gbr);}
.ph{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.pav{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gg));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:0.75rem;color:var(--obs);flex-shrink:0;}
.pau{font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.72rem;color:var(--ch);}
.pt{font-family:'Inter',sans-serif;font-size:0.6rem;color:var(--cd);}
.ptag{font-family:'Bebas Neue',sans-serif;font-size:0.52rem;letter-spacing:0.08em;color:var(--obs);background:var(--gold);padding:2px 5px;margin-left:auto;flex-shrink:0;}
.ptitle{font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.78rem;color:var(--ch);margin-bottom:5px;}
.pbody{font-family:'Inter',sans-serif;font-size:0.74rem;color:var(--cd);line-height:1.6;margin-bottom:8px;}
/* SOCIAL ACTIONS */
.pacts{display:flex;gap:0;border-top:1px solid rgba(255,255,255,0.04);padding-top:8px;}
.pa{flex:1;font-family:'Inter',sans-serif;font-size:0.66rem;color:var(--cd);cursor:pointer;background:none;border:none;padding:4px 0;transition:color 0.2s;display:flex;align-items:center;justify-content:center;gap:4px;}
.pa:hover{color:var(--gold);}
.pa.liked{color:var(--err);}
/* COMMUNITY POST FORM */
.post-form{background:var(--gb);border:1px solid var(--gbr);padding:14px;margin-bottom:14px;}
.post-form-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.post-form-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gg));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:0.76rem;color:var(--obs);flex-shrink:0;}
.post-form-input{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--gbr);color:var(--ch);font-family:'Inter',sans-serif;font-size:0.78rem;padding:9px 12px;outline:none;transition:border-color 0.3s;}
.post-form-input:focus{border-color:var(--gold);}
.post-form-input::placeholder{color:rgba(189,181,166,0.3);}
.post-form-actions{display:flex;gap:7px;align-items:center;margin-top:9px;}
.post-type-select{background:rgba(255,255,255,0.04);border:1px solid var(--gbr);color:var(--cd);font-family:'Inter',sans-serif;font-size:0.68rem;padding:6px 8px;outline:none;flex:1;}
.post-submit{font-family:'Montserrat',sans-serif;font-weight:800;font-size:0.6rem;letter-spacing:0.1em;padding:8px 14px;background:var(--gold);color:var(--obs);border:none;cursor:pointer;text-transform:uppercase;}
/* TAGS */
.tag{display:inline-block;font-family:'Bebas Neue',sans-serif;font-size:0.52rem;letter-spacing:0.08em;padding:2px 6px;}
.tg{background:rgba(255,184,0,0.12);color:var(--gold);}
.tok{background:rgba(34,197,94,0.12);color:var(--ok);}
.tbl{background:rgba(59,130,246,0.12);color:var(--ab);}
.terr{background:rgba(239,68,68,0.12);color:var(--err);}
.twarn{background:rgba(245,158,11,0.12);color:var(--warn);}
.tpur{background:rgba(139,92,246,0.12);color:var(--purple);}
/* NEWS CARDS */
.news-grid{display:grid;gap:8px;margin-bottom:14px;}
.news-card{background:var(--gb);border:1px solid var(--gbr);padding:13px;display:flex;gap:11px;transition:border-color 0.3s;cursor:pointer;}
.news-card:hover{border-color:var(--gbri);}
.news-thumb{width:64px;height:64px;border-radius:2px;object-fit:cover;flex-shrink:0;background:var(--obs2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
.news-thumb img{width:100%;height:100%;object-fit:cover;}
.news-content{flex:1;min-width:0;}
.news-cat{font-family:'Bebas Neue',sans-serif;font-size:0.52rem;letter-spacing:0.1em;color:var(--gold);margin-bottom:3px;}
.news-title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.74rem;color:var(--ch);line-height:1.3;margin-bottom:4px;}
.news-meta{font-family:'Inter',sans-serif;font-size:0.58rem;color:var(--cd);}
/* WELLNESS HUB */
.wellness-cats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:14px;}
.wcat{background:var(--gb);border:1px solid var(--gbr);padding:13px;cursor:pointer;transition:all 0.3s;text-align:center;}
.wcat:hover{border-color:var(--gbri);transform:translateY(-2px);}
.wcat-i{font-size:1.6rem;margin-bottom:6px;}
.wcat-n{font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.7rem;color:var(--ch);}
.wcat-d{font-family:'Inter',sans-serif;font-size:0.6rem;color:var(--cd);margin-top:3px;line-height:1.4;}
/* AFFILIATE PRODUCTS */
.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:14px;}
.prod-card{background:var(--gb);border:1px solid var(--gbr);overflow:hidden;transition:all 0.3s;}
.prod-card:hover{border-color:var(--gbri);}
.prod-img{width:100%;height:90px;background:var(--obs2);display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden;}
.prod-img img{width:100%;height:100%;object-fit:cover;}
.prod-info{padding:9px;}
.prod-name{font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.7rem;color:var(--ch);margin-bottom:3px;}
.prod-price{font-family:'Bebas Neue',sans-serif;font-size:0.85rem;color:var(--gold);}
.prod-commission{font-family:'Inter',sans-serif;font-size:0.55rem;color:var(--ok);margin-top:2px;}
.prod-btn{width:100%;margin-top:7px;padding:7px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:0.58rem;letter-spacing:0.08em;text-transform:uppercase;background:var(--gold);color:var(--obs);border:none;cursor:pointer;}
/* PAYMENT */
.pay-card{background:var(--gb);border:1px solid var(--gbr);padding:16px;margin-bottom:10px;}
.pay-title{font-family:'Playfair Display',serif;font-weight:700;font-size:0.95rem;color:var(--ch);margin-bottom:4px;}
.pay-desc{font-family:'Inter',sans-serif;font-size:0.7rem;color:var(--cd);margin-bottom:12px;line-height:1.5;}
.pay-methods{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.pay-method{display:flex;align-items:center;gap:5px;padding:8px 12px;border:1px solid var(--gbr);background:rgba(255,255,255,0.03);cursor:pointer;transition:all 0.3s;}
.pay-method:hover,.pay-method.on{border-color:var(--gold);}
.pay-method-icon{font-size:1.1rem;}
.pay-method-name{font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.64rem;color:var(--ch);}
.pay-step{background:rgba(255,184,0,0.05);border:1px solid var(--gbr);border-left:3px solid var(--gold);padding:10px 12px;margin-bottom:8px;}

.pay-step-text{font-family:'Inter',sans-serif;font-size:0.7rem;color:var(--cd);line-height:1.5;}

.upgrid{display:grid;gap:8px;}
.ucard{border:1px solid var(--gbr);background:var(--gb);padding:14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all 0.3s;}
.ucard:hover{border-color:var(--gbri);}
.ucard.cur{border-color:var(--gold);background:rgba(255,184,0,0.06);}
